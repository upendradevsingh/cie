name: Tests
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saleslens_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: saleslens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx
      - name: Run tests
        env:
          DATABASE_URL: postgresql://saleslens_test:test_password@localhost:5432/saleslens_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          OPENAI_API_KEY: sk-test-mock
          DEEPGRAM_API_KEY: dg-test-mock
        run: |
          cd backend
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false
