# Alembic configuration file for SalesLens.
#
# The sqlalchemy.url is intentionally left empty here because it is
# overridden at runtime in alembic/env.py from app.config.settings.
# This avoids duplicating the database URL in two places.

[alembic]
# Path to migration scripts directory.
script_location = alembic

# Template used to generate migration file names.
# Uses a date prefix for natural sort ordering.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path prepended before running migrations — ensures "app" is importable.
prepend_sys_path = .

# Timezone for the revision file template.
timezone = UTC

# Maximum length of characters to apply to the "slug" field of the revision.
truncate_slug_length = 40

# Set to 'true' to run each migration in its own transaction (recommended).
transaction_per_migration = true

# The database URL — overridden in env.py; this is just a placeholder.
sqlalchemy.url =

[post_write_hooks]
# Post-write hooks run after a new migration is generated.
# Uncomment below to auto-format migration files with black.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
